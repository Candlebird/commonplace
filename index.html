<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Commonplace</title>
  <meta name="description" content="A personal notebook: capture notes, file them into notebooks, tag them and search them on every device.">
  <meta name="theme-color" content="#c2410c">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    /* Same warm palette as candlebird.github.io. */
    :root {
      --bg: #f7f5f2;
      --card: #ffffff;
      --card-2: #f1eee9;
      --text: #1f1d1a;
      --muted: #6b665e;
      --border: #e4e0d9;
      --accent: #c2410c;
      --accent-text: #ffffff;
      --mark: #fde68a;
      --danger: #b91c1c;
      --shadow: 0 1px 2px rgba(0, 0, 0, .05);
      --radius: 12px;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161514;
        --card: #201f1d;
        --card-2: #2a2826;
        --text: #eeebe6;
        --muted: #a39d93;
        --border: #34322e;
        --accent: #fb923c;
        --accent-text: #1a0f05;
        --mark: #854d0e;
        --danger: #f87171;
        --shadow: none;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      min-height: 100vh;
    }
    [hidden] { display: none !important; }
    a { color: var(--accent); }
    button, input, select, textarea { font: inherit; color: inherit; }
    button {
      background: var(--card); border: 1px solid var(--border); border-radius: 8px;
      padding: 6px 12px; cursor: pointer; white-space: nowrap;
    }
    button:hover { border-color: var(--accent); }
    button:disabled { opacity: .45; cursor: default; border-color: var(--border); }
    button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
    button.danger { color: var(--danger); }
    button.armed { background: var(--danger); border-color: var(--danger); color: #fff; }
    button.ghost { background: none; border-color: transparent; }
    button.ghost:hover { border-color: var(--border); }
    input, select, textarea {
      background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; min-width: 0;
    }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
    textarea { resize: vertical; width: 100%; }
    mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }
    .muted { color: var(--muted); }
    .spacer { flex: 1; }

    /* ---- Top bar ---- */
    header.top {
      position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center; gap: 10px;
      padding: 10px 16px; background: color-mix(in srgb, var(--bg) 92%, transparent);
      backdrop-filter: blur(8px); border-bottom: 1px solid var(--border);
    }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 1.1rem; color: inherit; text-decoration: none; white-space: nowrap; }
    .brand img { width: 26px; height: 26px; }
    .search { flex: 1; max-width: 640px; position: relative; }
    .search input { width: 100%; padding-left: 34px; border-radius: 999px; background: var(--card); }
    .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); }
    .status { font-size: .8rem; color: var(--muted); white-space: nowrap; }
    #menu-btn { display: none; }
    .avatar { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border); padding: 0; overflow: hidden; display: grid; place-items: center; font-weight: 600; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }

    /* ---- Layout ---- */
    .layout { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 24px; max-width: 1180px; margin: 0 auto; padding: 16px; }
    nav.side { position: sticky; top: 68px; align-self: start; max-height: calc(100vh - 84px); overflow-y: auto; padding-bottom: 24px; }
    nav.side h4 { margin: 18px 8px 6px; font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); display: flex; align-items: center; }
    nav.side h4:first-child { margin-top: 0; }
    .nav-item {
      display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
      background: none; border: 0; border-radius: 8px; padding: 6px 10px;
    }
    .nav-item:hover { background: var(--card-2); }
    .nav-item.on { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); font-weight: 600; }
    .nav-item .n { margin-left: auto; color: var(--muted); font-size: .85rem; font-weight: 400; }
    .nav-item .label { overflow: hidden; text-overflow: ellipsis; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--muted)); flex: none; }
    .side-tools { display: grid; gap: 6px; margin-top: 20px; padding: 0 4px; }

    /* ---- Capture ---- */
    .capture { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 10px; margin-bottom: 16px; }
    .capture textarea { border: 0; padding: 4px 6px; resize: none; min-height: 44px; background: transparent; overflow: hidden; }
    .capture textarea:focus { outline: none; }
    .capture-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding-top: 6px; border-top: 1px solid var(--border); }
    .capture-row select, .capture-row input { padding: 4px 8px; font-size: .9rem; }
    .capture-row input { width: 150px; }
    .hint { font-size: .8rem; color: var(--muted); }

    /* ---- List ---- */
    .list-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 4px 0 12px; }
    .list-head h2 { margin: 0; font-size: 1.25rem; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 6px 2px 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); font-size: .85rem; }
    .chip button { border: 0; background: none; padding: 0 4px; color: var(--muted); }
    .group { margin: 18px 0 8px; font-size: .8rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
    .notes { display: grid; gap: 10px; }
    .note {
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow);
      padding: 12px 14px; cursor: pointer; position: relative;
    }
    .note:hover { border-color: color-mix(in srgb, var(--accent) 50%, var(--border)); }
    .note.selected { outline: 2px solid var(--accent); outline-offset: -1px; }
    .note.pinned { border-left: 3px solid var(--accent); }
    .note-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); }
    .src { display: inline-flex; align-items: center; gap: 5px; }
    .nb { padding: 0 8px; border-radius: 999px; background: var(--card-2); }
    .nb.inbox { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
    .note h3 { margin: 6px 0 2px; font-size: 1.02rem; }
    .body { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 4px; max-height: 14.5em; overflow: hidden; position: relative; }
    .body.long::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2.5em; background: linear-gradient(transparent, var(--card)); }
    .body .line { min-height: 1.5em; }
    .body .todo { display: flex; gap: 8px; align-items: flex-start; }
    .body .todo input { margin: 4px 0 0; width: 16px; height: 16px; accent-color: var(--accent); flex: none; padding: 0; }
    .body .todo.done span { text-decoration: line-through; color: var(--muted); }
    .tag { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; }
    .tag:hover { text-decoration: underline; }
    .tags { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; font-size: .85rem; }
    .thumb { margin-top: 8px; max-width: 100%; max-height: 220px; border-radius: 8px; border: 1px solid var(--border); display: block; background: var(--card-2); min-height: 60px; min-width: 120px; object-fit: cover; }
    .ocr-badge { font-size: .8rem; color: var(--muted); margin-top: 4px; }
    .note-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; opacity: 0; transition: opacity .12s; }
    .note:hover .note-actions, .note:focus-within .note-actions { opacity: 1; }
    .note-actions button { padding: 3px 10px; font-size: .85rem; }
    .pin { position: absolute; top: 8px; right: 8px; border: 0; background: none; padding: 4px; color: var(--muted); opacity: 0; }
    .note:hover .pin, .note.pinned .pin { opacity: 1; }
    .note.pinned .pin { color: var(--accent); }
    .pin svg { width: 16px; height: 16px; display: block; }
    .empty { text-align: center; padding: 48px 16px; color: var(--muted); border: 1px dashed var(--border); border-radius: var(--radius); }
    .banner { padding: 10px 14px; border-radius: 10px; margin-bottom: 12px; border: 1px solid var(--border); background: var(--card); display: flex; gap: 10px; align-items: flex-start; }
    .banner.err { border-color: var(--danger); }
    .banner p { margin: 0; flex: 1; }

    .bulk {
      position: sticky; bottom: 12px; z-index: 15; margin-top: 16px;
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
      background: var(--card); border: 1px solid var(--accent); border-radius: var(--radius); padding: 8px 12px;
      box-shadow: 0 6px 24px rgba(0,0,0,.15);
    }

    /* ---- Sign in ---- */
    .gate { max-width: 460px; margin: 12vh auto; padding: 32px 24px; text-align: center; background: var(--card); border: 1px solid var(--border); border-radius: 16px; }
    .gate img { width: 64px; height: 64px; }
    .gate h1 { margin: 12px 0 4px; }
    .gate p { color: var(--muted); }
    .gate ul { text-align: left; color: var(--muted); padding-left: 20px; }
    .gate button.primary { padding: 10px 20px; margin-top: 8px; }

    /* ---- Dialogs ---- */
    dialog {
      border: 1px solid var(--border); border-radius: 16px; padding: 0; background: var(--card); color: var(--text);
      width: min(720px, calc(100vw - 24px)); max-height: calc(100vh - 32px);
    }
    dialog::backdrop { background: rgba(0, 0, 0, .45); }
    dialog form { display: flex; flex-direction: column; max-height: calc(100vh - 34px); }
    .dlg-body { padding: 16px 18px; overflow-y: auto; display: grid; gap: 12px; }
    .dlg-foot { display: flex; gap: 8px; align-items: center; padding: 12px 18px; border-top: 1px solid var(--border); flex-wrap: wrap; }
    .dlg-title { font-size: 1.1rem; font-weight: 700; margin: 0; }
    .ed-title { font-size: 1.2rem; font-weight: 600; border: 0; padding: 4px 0; background: none; }
    .ed-title:focus { outline: none; }
    .ed-body { min-height: 220px; border: 0; padding: 4px 0; background: none; line-height: 1.55; }
    .ed-body:focus { outline: none; }
    .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
    .fields label, .field { display: grid; gap: 4px; font-size: .8rem; color: var(--muted); }
    .fields input, .fields select { color: var(--text); font-size: .95rem; }
    .photo { display: grid; gap: 8px; }
    .photo img { max-width: 100%; max-height: 360px; border-radius: 10px; border: 1px solid var(--border); justify-self: start; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); }
    .tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 8px 12px; }
    .tabs button.on { border-bottom-color: var(--accent); color: var(--accent); font-weight: 600; }
    .help { font-size: .9rem; color: var(--muted); }
    .help h3 { color: var(--text); font-size: .95rem; margin: 14px 0 4px; }
    .help p, .help ul { margin: 0 0 6px; }
    .help code { background: var(--card-2); padding: 1px 5px; border-radius: 4px; font-size: .85rem; }

    .fab { display: none; }
    #toasts { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 40; display: grid; gap: 8px; width: max-content; max-width: calc(100vw - 32px); pointer-events: none; }
    .toast { background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.25); font-size: .9rem; }

    @media (max-width: 760px) {
      header.top { padding: 8px 12px; gap: 8px; }
      .brand span, .status { display: none; }
      #menu-btn { display: grid; place-items: center; padding: 6px; }
      .layout { grid-template-columns: minmax(0, 1fr); padding: 12px; }
      nav.side {
        position: fixed; inset: 0 auto 0 0; z-index: 30; width: min(300px, 85vw); max-height: none; top: 0;
        background: var(--bg); border-right: 1px solid var(--border); padding: 16px 12px 32px;
        transform: translateX(-100%); transition: transform .2s;
      }
      nav.side.open { transform: none; box-shadow: 0 0 40px rgba(0,0,0,.3); }
      .scrim { position: fixed; inset: 0; z-index: 25; background: rgba(0,0,0,.35); }
      .note-actions, .pin { opacity: 1; }
      .capture-row input { width: 120px; }
      dialog { width: 100vw; max-width: 100vw; height: 100dvh; max-height: 100dvh; border-radius: 0; margin: 0; }
      dialog form { max-height: 100dvh; height: 100%; }
      .dlg-body { flex: 1; }
      .fab {
        display: grid; place-items: center; position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 18;
        width: 56px; height: 56px; border-radius: 50%; padding: 0; font-size: 1.8rem; line-height: 1;
        background: var(--accent); color: var(--accent-text); border: 0; box-shadow: 0 6px 18px rgba(0,0,0,.25);
      }
    }
  </style>
</head>
<body>
  <div id="gate" class="gate" hidden></div>

  <div id="app" hidden>
    <header class="top">
      <button id="menu-btn" class="ghost" data-act="menu" aria-label="Menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <a class="brand" href="./"><img src="icon.svg" alt=""><span>Commonplace</span></a>
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search notes   ( / )" autocomplete="off" aria-label="Search notes">
      </label>
      <span id="status" class="status"></span>
      <button id="avatar" class="avatar" data-act="account" title="Account"></button>
    </header>

    <div class="layout">
      <nav id="side" class="side" aria-label="Filters"></nav>
      <div id="scrim" class="scrim" data-act="menu" hidden></div>
      <main>
        <div id="banner"></div>
        <form id="capture" class="capture" autocomplete="off">
          <textarea id="cap-text" rows="1" placeholder="Jot something down… #tags and - [ ] checklists work"></textarea>
          <div class="capture-row">
            <select id="cap-source" aria-label="Where this note came from"></select>
            <input id="cap-nb" list="nb-list" placeholder="Inbox" aria-label="Notebook">
            <span class="hint" id="cap-hint">Ctrl+Enter to save</span>
            <span class="spacer"></span>
            <button type="button" data-act="new" class="ghost">Full editor</button>
            <button type="submit" class="primary">Add</button>
          </div>
        </form>
        <div id="list"></div>
      </main>
    </div>
    <button class="fab" data-act="new" aria-label="New note">+</button>
  </div>

  <datalist id="nb-list"></datalist>
  <div id="toasts" aria-live="polite"></div>

  <!-- Note editor -->
  <dialog id="editor">
    <form id="ed-form" method="dialog" autocomplete="off">
      <div class="dlg-body">
        <input name="title" class="ed-title" placeholder="Title">
        <textarea name="body" class="ed-body" placeholder="Note… use #tags, and lines starting with - [ ] become checkboxes"></textarea>
        <div class="photo" id="ed-photo"></div>
        <div class="fields">
          <label>Notebook <input name="notebook" list="nb-list" placeholder="Inbox (unfiled)"></label>
          <label>Came from <select name="source"></select></label>
          <label>Labels <input name="labels" placeholder="comma, separated"></label>
          <label>Date written <input name="capturedAt" type="date"></label>
        </div>
      </div>
      <div class="dlg-foot">
        <button type="button" data-act="ed-photo-add">Add photo</button>
        <button type="button" class="danger" data-act="ed-delete" id="ed-delete">Delete</button>
        <span class="spacer hint" id="ed-meta"></span>
        <button type="button" data-act="ed-cancel">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
    <input type="file" id="photo-input" accept="image/*" hidden>
  </dialog>

  <!-- Move to notebook / label -->
  <dialog id="move" style="width:min(420px, calc(100vw - 24px)); height:auto">
    <form id="move-form" method="dialog" autocomplete="off">
      <div class="dlg-body">
        <p class="dlg-title" id="move-title">Move to notebook</p>
        <input name="value" id="move-input" list="nb-list" placeholder="Notebook name (blank = Inbox)">
        <p class="hint" id="move-hint" style="margin:0">Pick an existing notebook or type a new name.</p>
      </div>
      <div class="dlg-foot">
        <span class="spacer"></span>
        <button type="button" data-act="move-cancel">Cancel</button>
        <button type="submit" class="primary">Move</button>
      </div>
    </form>
  </dialog>

  <!-- Import -->
  <dialog id="import"></dialog>

  <!-- Account -->
  <dialog id="account" style="width:min(420px, calc(100vw - 24px)); height:auto">
    <form method="dialog">
      <div class="dlg-body" id="acct-body"></div>
      <div class="dlg-foot">
        <button type="button" data-act="signout">Sign out</button>
        <span class="spacer"></span>
        <button type="submit" class="primary">Close</button>
      </div>
    </form>
  </dialog>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';
    import { getAuth, GoogleAuthProvider, onAuthStateChanged, signInWithPopup, signOut } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';
    import {
      collection, doc, getDoc, getFirestore, initializeFirestore, onSnapshot, persistentLocalCache, persistentMultipleTabManager,
      query, where, writeBatch,
    } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';

    // The Crusade Dataslate's Firebase project, shared by the Candlebird apps (not secret: firestore.rules protects the data).
    // This app only touches notes/* and notePhotos/*, and each person only ever sees their own.
    const app = initializeApp({
      apiKey: 'AIzaSyBHBFpcIP-S9m7hp6nEa07Y7aTlaE01cRA',
      authDomain: 'crusade-dataslate.firebaseapp.com',
      projectId: 'crusade-dataslate',
      storageBucket: 'crusade-dataslate.firebasestorage.app',
      messagingSenderId: '765607704790',
      appId: '1:765607704790:web:cc6bc5539e268daacdb177',
    });
    const auth = getAuth(app);
    let db;
    try {
      // Keep a copy on the device so notes open instantly and can be written offline; they sync when back online.
      db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
    } catch {
      db = getFirestore(app);
    }

    const SOURCES = [
      { id: 'phone', label: 'Phone', c: '#2563eb' },
      { id: 'keep', label: 'Google Keep', c: '#ca8a04' },
      { id: 'drive', label: 'Google Drive', c: '#16a34a' },
      { id: 'gemini', label: 'Gemini', c: '#7c3aed' },
      { id: 'home', label: 'Google Home', c: '#0891b2' },
      { id: 'paper', label: 'Paper notebook', c: '#b45309' },
      { id: 'web', label: 'Web', c: '#db2777' },
      { id: 'other', label: 'Other', c: '#64748b' },
    ];
    const SRC = Object.fromEntries(SOURCES.map((s) => [s.id, s]));
    const srcOf = (n) => SRC[n.source] || SRC.other;
    const BOXES = [
      { id: 'inbox', label: 'Inbox', hint: 'Not filed into a notebook yet' },
      { id: 'all', label: 'All notes' },
      { id: 'pinned', label: 'Pinned' },
      { id: 'archive', label: 'Archive' },
      { id: 'trash', label: 'Trash' },
    ];
    const VIEW_KEY = 'commonplace.view';

    const state = {
      user: undefined,
      error: '',
      denied: false,
      loaded: false,
      offline: false,
      pending: false,
      notes: new Map(),
      photos: new Map(),
      box: 'inbox',
      notebook: null,
      source: null,
      tag: null,
      q: '',
      sort: 'edited',
      captureSource: 'phone',
      selecting: false,
      selected: new Set(),
      armed: null,
      navOpen: false,
      showAllTags: false,
    };
    try { Object.assign(state, JSON.parse(localStorage.getItem(VIEW_KEY) || '{}')); } catch {}
    const saveView = () => {
      try { localStorage.setItem(VIEW_KEY, JSON.stringify({ box: state.box, sort: state.sort, captureSource: state.captureSource })); } catch {}
    };

    const $ = (s) => document.querySelector(s);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    const norm = (s) => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
    const reEsc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const nowIso = () => new Date().toISOString();
    const me = () => state.user?.email;
    const uniq = (a) => [...new Set(a)];

    // ---- Tags, dates ---------------------------------------------------------------------------------

    const HASHTAG = /(?:^|\s)#([\p{L}\p{N}_][\p{L}\p{N}_-]*)/gu;
    const hashtags = (text) => [...String(text ?? '').matchAll(HASHTAG)].map((m) => m[1].toLowerCase()).filter((t) => /\p{L}/u.test(t));
    const tagCache = new WeakMap();
    function tagsOf(n) {
      let t = tagCache.get(n);
      if (!t) {
        t = uniq([...(n.labels || []).map((l) => l.toLowerCase().replace(/^#/, '').trim()).filter(Boolean), ...hashtags(n.title), ...hashtags(n.body)]);
        tagCache.set(n, t);
      }
      return t;
    }
    const parseLabels = (s) => uniq(String(s || '').split(',').map((x) => x.trim().replace(/^#/, '')).filter(Boolean));
    const when = (n) => n.capturedAt || n.createdAt || '';
    const sortKey = (n) => (state.sort === 'written' ? when(n) : n.updatedAt || n.createdAt || '');
    const asDate = (s) => (/^\d{4}-\d{2}-\d{2}$/.test(s) ? new Date(s + 'T12:00:00') : new Date(s));
    const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

    function fmtDate(s) {
      if (!s) return '';
      const d = asDate(s);
      if (isNaN(d)) return '';
      const now = new Date();
      if (s.length > 10 && ymd(d) === ymd(now)) return d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
      return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', ...(d.getFullYear() !== now.getFullYear() ? { year: 'numeric' } : {}) });
    }
    function groupOf(s) {
      if (!s) return 'Undated';
      const d = asDate(s);
      const now = new Date();
      const days = Math.floor((asDate(ymd(now)) - asDate(ymd(d))) / 864e5);
      if (days <= 0) return 'Today';
      if (days === 1) return 'Yesterday';
      if (days < 7) return 'This week';
      if (days < 31 && d.getMonth() === now.getMonth()) return 'Earlier this month';
      return d.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
    }

    // ---- Search --------------------------------------------------------------------------------------

    function parseQuery(q) {
      const out = { terms: [], not: [], tags: [], in: [], from: [], is: [], before: null, after: null };
      for (const m of q.matchAll(/(-?)(?:([a-z]+):)?(?:"([^"]*)"?|(\S+))/gi)) {
        const neg = m[1] === '-';
        const key = (m[2] || '').toLowerCase();
        const val = (m[3] ?? m[4] ?? '').trim();
        if (!val) continue;
        const v = norm(val);
        if (!key && v.startsWith('#') && v.length > 1) out.tags.push({ v: v.slice(1), neg });
        else if (key === 'tag' || key === 'label') out.tags.push({ v: v.replace(/^#/, ''), neg });
        else if (key === 'in' || key === 'notebook') out.in.push({ v, neg });
        else if (key === 'from' || key === 'source') out.from.push({ v, neg });
        else if (key === 'is' || key === 'has') out.is.push({ v, neg });
        else if (key === 'before') out.before = val;
        else if (key === 'after') out.after = val;
        else (neg ? out.not : out.terms).push(key ? `${norm(key)}:${v}` : v);
      }
      return out;
    }
    const hayCache = new WeakMap();
    function hay(n) {
      let h = hayCache.get(n);
      if (!h) {
        h = { title: norm(n.title), all: norm([n.title, n.body, n.ocr, n.notebook, (n.labels || []).join(' '), srcOf(n).label].join('\n')) };
        hayCache.set(n, h);
      }
      return h;
    }
    const isFlag = (n, f) => {
      if (f === 'pinned') return !!n.pinned;
      if (f === 'archived') return !!n.archived;
      if (f === 'inbox' || f === 'unfiled') return !n.notebook;
      if (f === 'photo' || f === 'image') return !!n.hasPhoto;
      if (f === 'todo') return /^\s*[-*] \[ \]/m.test(n.body || '');
      if (f === 'done') return /^\s*[-*] \[x\]/im.test(n.body || '') && !/^\s*[-*] \[ \]/m.test(n.body || '');
      return false;
    };
    /** 0 = no match, otherwise a relevance score. */
    function score(n, Q) {
      const h = hay(n);
      const tags = tagsOf(n);
      for (const t of Q.tags) if (tags.some((x) => x === t.v || x.startsWith(t.v + '/')) === t.neg) return 0;
      for (const t of Q.in) if (norm(n.notebook).includes(t.v) === t.neg) return 0;
      for (const t of Q.from) {
        const s = srcOf(n);
        if ((s.id.startsWith(t.v) || norm(s.label).includes(t.v)) === t.neg) return 0;
      }
      for (const t of Q.is) if (isFlag(n, t.v) === t.neg) return 0;
      const w = when(n).slice(0, 10);
      if (Q.before && !(w && w < Q.before)) return 0;
      if (Q.after && !(w && w >= Q.after)) return 0;
      for (const t of Q.not) if (h.all.includes(t)) return 0;
      let s = 1;
      for (const t of Q.terms) {
        if (!h.all.includes(t)) return 0;
        if (h.title.includes(t)) s += 6;
        if (tags.includes(t)) s += 4;
        if (norm(n.notebook) === t) s += 3;
        s += Math.min(5, h.all.split(t).length - 1);
      }
      return s;
    }
    let hlRe = null;
    function setHighlight(Q) {
      const words = [...Q.terms, ...Q.tags.filter((t) => !t.neg).map((t) => '#' + t.v)].filter((t) => t.length > 0);
      hlRe = words.length ? new RegExp(`(${words.sort((a, b) => b.length - a.length).map(reEsc).join('|')})`, 'gi') : null;
    }
    const hl = (s) => (hlRe ? String(s).split(hlRe).map((p, i) => (i % 2 ? `<mark>${esc(p)}</mark>` : esc(p))).join('') : esc(s));

    // ---- Data ----------------------------------------------------------------------------------------

    let unsubs = [];
    onAuthStateChanged(auth, (u) => {
      unsubs.forEach((f) => f());
      unsubs = [];
      Object.assign(state, { user: u, notes: new Map(), photos: new Map(), loaded: false, denied: false, error: '', selected: new Set(), selecting: false });
      render();
      if (!u) return;
      unsubs.push(onSnapshot(
        query(collection(db, 'notes'), where('owner', '==', u.email)),
        { includeMetadataChanges: true },
        (snap) => {
          state.notes = new Map(snap.docs.map((d) => [d.id, { id: d.id, ...d.data() }]));
          state.loaded = true;
          state.denied = false;
          state.offline = snap.metadata.fromCache;
          state.pending = snap.metadata.hasPendingWrites;
          for (const id of state.selected) if (!state.notes.has(id)) state.selected.delete(id);
          render();
          takeShare();
        },
        (e) => {
          if (e.code === 'permission-denied') state.denied = true;
          else state.error = e.message;
          state.loaded = true;
          render();
        },
      ));
    });

    const fail = (e) => { console.error(e); state.error = e?.message || String(e); render(); };
    const newId = () => doc(collection(db, 'notes')).id;

    /** Write several note patches (and photos) in as few batches as Firestore allows. */
    async function writeNotes(items) {
      for (let i = 0; i < items.length; i += 200) {
        const batch = writeBatch(db);
        for (const { id, patch, photo } of items.slice(i, i + 200)) {
          batch.set(doc(db, 'notes', id), { ...patch, owner: me(), updatedAt: patch.updatedAt || nowIso() }, { merge: true });
          if (typeof photo === 'string') batch.set(doc(db, 'notePhotos', id), { owner: me(), data: photo });
          else if (photo === null) batch.delete(doc(db, 'notePhotos', id));
        }
        // Don't wait for the server: offline writes are queued and the snapshot updates right away.
        batch.commit().catch(fail);
      }
    }
    const patchNotes = (ids, patch) => writeNotes([...ids].map((id) => ({ id, patch: { ...patch } })));
    function destroy(ids) {
      const list = [...ids];
      for (let i = 0; i < list.length; i += 200) {
        const batch = writeBatch(db);
        for (const id of list.slice(i, i + 200)) {
          batch.delete(doc(db, 'notes', id));
          if (state.notes.get(id)?.hasPhoto) batch.delete(doc(db, 'notePhotos', id));
          state.selected.delete(id);
        }
        batch.commit().catch(fail);
      }
    }
    async function loadPhoto(id) {
      if (state.photos.has(id)) return state.photos.get(id);
      const snap = await getDoc(doc(db, 'notePhotos', id));
      const data = snap.exists() ? String(snap.data().data || '') : '';
      state.photos.set(id, data);
      return data;
    }

    function blankNote(extra = {}) {
      const t = nowIso();
      return { title: '', body: '', labels: [], source: state.captureSource, notebook: '', pinned: false, archived: false, trashed: false,
        hasPhoto: false, ocr: '', capturedAt: '', createdAt: t, updatedAt: t, ...extra };
    }

    // ---- Rendering -----------------------------------------------------------------------------------

    const PIN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg>';

    function render() {
      const u = state.user;
      $('#gate').hidden = !!u;
      $('#app').hidden = !u;
      if (u === undefined) { $('#gate').hidden = true; return; }
      if (!u) return renderGate();
      if (!$('#cap-source').options.length) $('#cap-source').innerHTML = sourceOptions(state.captureSource);
      $('#avatar').innerHTML = u.photoURL ? `<img src="${esc(u.photoURL)}" alt="" referrerpolicy="no-referrer">` : esc((u.displayName || u.email || '?')[0]);
      $('#status').textContent = !state.loaded ? 'Loading…' : state.pending ? 'Saving…' : state.offline ? 'Offline · saved on this device' : 'Synced';
      renderBanner();
      renderSide();
      renderList();
      renderNotebookList();
    }

    function renderGate() {
      $('#gate').innerHTML = `
        <img src="icon.svg" alt="">
        <h1>Commonplace</h1>
        <p>A personal notebook. Jot things down, file them into notebooks, tag them and search everything, on every device you use.</p>
        <button class="primary" data-act="signin">Sign in</button>
        <p style="font-size:.85rem">Notes are private to the account you sign in with.<br>
          A small open-source project by Candlebird · <a href="https://github.com/Candlebird/commonplace">source code</a> · <a href="https://candlebird.github.io/">other projects</a></p>
        ${state.error ? `<p style="color:var(--danger)">${esc(state.error)}</p>` : ''}`;
    }

    function renderBanner() {
      let h = '';
      if (state.denied) {
        h += `<div class="banner err"><p><b>Can't reach your notes yet.</b> The database hasn't been told about Commonplace: the <code>notes</code> rules in
          the Dataslate's <code>firestore.rules</code> need publishing in the Firebase console (Firestore → Rules).</p></div>`;
      }
      if (state.error) h += `<div class="banner err"><p>${esc(state.error)}</p><button class="ghost" data-act="dismiss">Dismiss</button></div>`;
      $('#banner').innerHTML = h;
    }

    function counts() {
      const c = { inbox: 0, all: 0, pinned: 0, archive: 0, trash: 0, nb: new Map(), src: new Map(), tag: new Map() };
      for (const n of state.notes.values()) {
        if (n.trashed) { c.trash++; continue; }
        if (n.archived) { c.archive++; continue; }
        c.all++;
        if (!n.notebook) c.inbox++;
        if (n.pinned) c.pinned++;
        if (n.notebook) c.nb.set(n.notebook, (c.nb.get(n.notebook) || 0) + 1);
        const s = srcOf(n).id;
        c.src.set(s, (c.src.get(s) || 0) + 1);
        for (const t of tagsOf(n)) c.tag.set(t, (c.tag.get(t) || 0) + 1);
      }
      return c;
    }
    const notebooks = () => uniq([...state.notes.values()].filter((n) => !n.trashed && n.notebook).map((n) => n.notebook)).sort((a, b) => a.localeCompare(b));

    function renderSide() {
      const c = counts();
      const item = (act, attrs, on, label, n, dot) =>
        `<button class="nav-item ${on ? 'on' : ''}" data-act="${act}" ${attrs}>${dot ? `<span class="dot" style="--c:${dot}"></span>` : ''}<span class="label">${esc(label)}</span>${n ? `<span class="n">${n}</span>` : ''}</button>`;
      const facet = !state.notebook && !state.source && !state.tag;
      let h = BOXES.map((b) => item('box', `data-box="${b.id}" title="${esc(b.hint || '')}"`, facet && state.box === b.id, b.label, c[b.id])).join('');
      const nbs = [...c.nb.entries()].sort((a, b) => a[0].localeCompare(b[0]));
      h += `<h4>Notebooks</h4>`;
      h += nbs.length ? nbs.map(([nb, n]) => item('nb', `data-nb="${esc(nb)}"`, state.notebook === nb, nb, n, 'var(--accent)')).join('')
        : `<p class="hint" style="margin:0 10px">File a note to start one.</p>`;
      h += `<h4>Came from</h4>`;
      h += SOURCES.filter((s) => c.src.get(s.id) || state.source === s.id).map((s) => item('src', `data-src="${s.id}"`, state.source === s.id, s.label, c.src.get(s.id), s.c)).join('')
        || `<p class="hint" style="margin:0 10px">Nothing yet.</p>`;
      const tags = [...c.tag.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
      if (tags.length) {
        h += `<h4>Tags</h4>`;
        const shown = state.showAllTags ? tags : tags.slice(0, 15);
        h += shown.map(([t, n]) => item('tag', `data-tag="${esc(t)}"`, state.tag === t, '#' + t, n)).join('');
        if (tags.length > 15) h += `<button class="nav-item hint" data-act="more-tags">${state.showAllTags ? 'Fewer' : `All ${tags.length} tags`}</button>`;
      }
      h += `<div class="side-tools">
        <button data-act="import">Import &amp; capture help</button>
        <button data-act="export-md">Export as Markdown</button>
        <button data-act="export-json">Export backup (JSON)</button>
      </div>`;
      $('#side').innerHTML = h;
      $('#side').classList.toggle('open', state.navOpen);
      $('#scrim').hidden = !state.navOpen;
    }

    function renderNotebookList() {
      const html = notebooks().map((n) => `<option value="${esc(n)}">`).join('');
      if ($('#nb-list').innerHTML !== html) $('#nb-list').innerHTML = html;
    }

    function visible() {
      const searching = state.q.trim() !== '';
      const Q = parseQuery(state.q);
      setHighlight(Q);
      const out = [];
      for (const n of state.notes.values()) {
        if (state.box === 'trash' && !state.notebook && !state.source && !state.tag) { if (!n.trashed) continue; }
        else {
          if (n.trashed) continue;
          const faceted = state.notebook || state.source || state.tag;
          if (!searching && !faceted) {
            if (state.box === 'archive' ? !n.archived : n.archived) continue;
            if (state.box === 'inbox' && n.notebook) continue;
            if (state.box === 'pinned' && !n.pinned) continue;
          } else if (!searching && n.archived) continue;
        }
        if (state.notebook && n.notebook !== state.notebook) continue;
        if (state.source && srcOf(n).id !== state.source) continue;
        if (state.tag && !tagsOf(n).includes(state.tag)) continue;
        const s = searching ? score(n, Q) : 1;
        if (s) out.push({ n, s });
      }
      const key = (x) => sortKey(x.n);
      if (searching) out.sort((a, b) => b.s - a.s || key(b).localeCompare(key(a)));
      else out.sort((a, b) => (state.box !== 'trash' && (b.n.pinned ? 1 : 0) - (a.n.pinned ? 1 : 0)) || key(b).localeCompare(key(a)));
      return { list: out.map((x) => x.n), searching };
    }

    function heading() {
      if (state.notebook) return state.notebook;
      if (state.source) return SRC[state.source]?.label || state.source;
      if (state.tag) return '#' + state.tag;
      return BOXES.find((b) => b.id === state.box)?.label || 'Notes';
    }

    /** One line of a note body: checklists become checkboxes; links and #tags become clickable. */
    function renderLine(line, i, interactive) {
      const todo = line.match(/^(\s*)[-*] \[( |x|X)\] ?(.*)$/);
      const inline = (s) => s.split(/(https?:\/\/[^\s<>"]+|(?<=^|\s)#[\p{L}\p{N}_][\p{L}\p{N}_-]*)/u).map((p, k) => {
        if (k % 2 === 0) return hl(p);
        if (p.startsWith('#')) return `<button type="button" class="tag" data-act="tag" data-tag="${esc(p.slice(1).toLowerCase())}">${hl(p)}</button>`;
        return `<a href="${esc(p)}" target="_blank" rel="noopener">${hl(p.length > 60 ? p.slice(0, 57) + '…' : p)}</a>`;
      }).join('');
      if (todo) {
        const done = todo[2] !== ' ';
        return `<div class="line todo ${done ? 'done' : ''}" style="padding-left:${todo[1].length * 6}px"><input type="checkbox" ${done ? 'checked' : ''} ${interactive ? `data-act="check" data-line="${i}"` : 'disabled'} aria-label="Done"><span>${inline(todo[3])}</span></div>`;
      }
      return `<div class="line">${inline(line)}</div>`;
    }

    function snippet(n) {
      const body = String(n.body || '');
      if (!hlRe) return null;
      hlRe.lastIndex = 0;
      const m = hlRe.exec(body);
      hlRe.lastIndex = 0;
      if (!m || m.index < 400) return null;
      const start = body.lastIndexOf('\n', m.index - 120) + 1 || Math.max(0, m.index - 120);
      return '…' + body.slice(Math.max(start, m.index - 160));
    }

    function renderNote(n) {
      const s = srcOf(n);
      const body = snippet(n) ?? String(n.body || '');
      const lines = body.split('\n');
      const shown = lines.slice(0, 40);
      const long = lines.length > 9 || body.length > 700;
      const offset = body === n.body ? 0 : null; // checkbox toggling only maps onto the real body
      const tags = tagsOf(n).filter((t) => !hashtags(n.body).includes(t) && !hashtags(n.title).includes(t));
      const armed = state.armed === n.id;
      const ocrHit = hlRe && n.ocr && (hlRe.lastIndex = 0, hlRe.test(n.ocr));
      if (hlRe) hlRe.lastIndex = 0;
      const actions = n.trashed
        ? `<button data-act="restore">Restore</button><button class="${armed ? 'armed' : 'danger'}" data-act="purge">${armed ? 'Delete forever?' : 'Delete forever'}</button>`
        : `<button data-act="file">${n.notebook ? 'Move' : 'File'}…</button>
           <button data-act="archive">${n.archived ? 'Unarchive' : 'Archive'}</button>
           <button class="danger" data-act="trash">Delete</button>`;
      return `
        <article class="note ${n.pinned && !n.trashed ? 'pinned' : ''} ${state.selected.has(n.id) ? 'selected' : ''}" data-id="${n.id}" data-act="open" tabindex="0">
          ${n.trashed ? '' : `<button class="pin" data-act="pin" title="${n.pinned ? 'Unpin' : 'Pin'}" aria-label="${n.pinned ? 'Unpin' : 'Pin'}">${PIN}</button>`}
          <div class="note-meta">
            <span class="src"><span class="dot" style="--c:${s.c}"></span>${esc(s.label)}</span>
            ${n.notebook ? `<span class="nb">${hl(n.notebook)}</span>` : `<span class="nb inbox">Inbox</span>`}
            ${n.archived ? '<span>Archived</span>' : ''}
            <span title="${n.capturedAt ? 'Written' : 'Added'} ${esc(when(n))}">${esc(fmtDate(state.sort === 'written' ? when(n) : n.updatedAt))}</span>
          </div>
          ${n.title ? `<h3>${hl(n.title)}</h3>` : ''}
          ${body.trim() ? `<div class="body ${long ? 'long' : ''}">${shown.map((l, i) => renderLine(l, i, offset === 0 && !n.trashed)).join('')}</div>` : ''}
          ${n.hasPhoto ? `<img class="thumb" data-photo="${n.id}" alt="Photo" ${state.photos.get(n.id) ? `src="${state.photos.get(n.id)}"` : ''}>` : ''}
          ${ocrHit ? `<div class="ocr-badge">Match in the photo's text</div>` : ''}
          ${tags.length ? `<div class="tags">${tags.map((t) => `<button type="button" class="tag" data-act="tag" data-tag="${esc(t)}">#${hl(t)}</button>`).join('')}</div>` : ''}
          <div class="note-actions">${state.selecting ? '' : actions}</div>
        </article>`;
    }

    function renderList() {
      if (!state.loaded) { $('#list').innerHTML = `<div class="empty">Loading your notes…</div>`; return; }
      const { list, searching } = visible();
      const chips = [];
      if (state.notebook) chips.push(['nb', 'Notebook: ' + state.notebook]);
      if (state.source) chips.push(['src', 'From: ' + (SRC[state.source]?.label || state.source)]);
      if (state.tag) chips.push(['tag', '#' + state.tag]);
      let h = `<div class="list-head">
        <h2>${searching ? 'Search' : esc(heading())}</h2>
        <span class="muted">${list.length} note${list.length === 1 ? '' : 's'}</span>
        <div class="chips">${chips.map(([k, l]) => `<span class="chip">${esc(l)}<button data-act="clear" data-k="${k}" aria-label="Remove filter">✕</button></span>`).join('')}</div>
        <span class="spacer"></span>
        <select data-act="sort" aria-label="Sort">
          <option value="edited" ${state.sort === 'edited' ? 'selected' : ''}>Recently edited</option>
          <option value="written" ${state.sort === 'written' ? 'selected' : ''}>Date written</option>
        </select>
        <button data-act="select">${state.selecting ? 'Done' : 'Select'}</button>
        ${state.box === 'trash' && !searching && list.length && !chips.length ? `<button class="${state.armed === 'empty-trash' ? 'armed' : 'danger'}" data-act="empty-trash">${state.armed === 'empty-trash' ? 'Really empty?' : 'Empty trash'}</button>` : ''}
      </div>`;

      if (!list.length) {
        const msg = searching ? `Nothing matches <b>${esc(state.q)}</b>.`
          : state.notes.size === 0 ? `No notes yet. Jot one above, or <button class="ghost" data-act="import" style="color:var(--accent)">bring notes in</button> from other apps or files.`
          : state.box === 'inbox' && !chips.length ? 'Inbox zero. Everything is filed.'
          : 'No notes here.';
        h += `<div class="empty">${msg}</div>`;
      } else if (searching) {
        h += `<div class="notes">${list.slice(0, 300).map(renderNote).join('')}</div>`;
      } else {
        let last = null;
        const parts = [];
        let pinnedDone = false;
        for (const n of list.slice(0, 500)) {
          if (n.pinned && state.box !== 'trash' && !pinnedDone) {
            if (last !== 'Pinned') { parts.push(`${last ? '</div>' : ''}<div class="group">Pinned</div><div class="notes">`); last = 'Pinned'; }
          } else {
            pinnedDone = true;
            const g = groupOf(sortKey(n));
            if (g !== last) { parts.push(`${last ? '</div>' : ''}<div class="group">${esc(g)}</div><div class="notes">`); last = g; }
          }
          parts.push(renderNote(n));

            <button class="${state.armed === 'bulk' ? 'armed' : 'danger'}" data-act="bulk-purge" ${k ? '' : 'disabled'}>${state.armed === 'bulk' ? 'Delete forever?' : 'Delete forever'}</button>`

            <button data-act="bulk-pin" ${k ? '' : 'disabled'}>Pin</button>
            <button data-act="bulk-archive" ${k ? '' : 'disabled'}>Archive</button>
            <button class="danger" data-act="bulk-trash" ${k ? '' : 'disabled'}>Delete</button>`}

      watchPhotos();
    }

    // Load photos only when their note scrolls into view.
    const photoObserver = 'IntersectionObserver' in window ? new IntersectionObserver((entries) => {
      for (const e of entries) {
        if (!e.isIntersecting) continue;
        photoObserver.unobserve(e.target);
        const id = e.target.dataset.photo;
        loadPhoto(id).then((data) => { if (data) e.target.src = data; else e.target.remove(); }).catch(() => e.target.remove());
      }
    }, { rootMargin: '400px' }) : null;
    function watchPhotos() {
      for (const img of document.querySelectorAll('img[data-photo]:not([src])')) {
        if (photoObserver) photoObserver.observe(img);
        else loadPhoto(img.dataset.photo).then((d) => { if (d) img.src = d; });
      }
    }

    // ---- Editor --------------------------------------------------------------------------------------

    const ed = { id: null, photo: undefined, ocrBusy: false };
    const edForm = $('#ed-form');
    const F = edForm.elements;
    const sourceOptions = (sel) => SOURCES.map((s) => `<option value="${s.id}" ${s.id === sel ? 'selected' : ''}>${esc(s.label)}</option>`).join('');

    function openEditor(n, fresh = false) {
      ed.id = fresh ? null : n.id;
      ed.base = n;
      ed.photo = undefined;
      ed.ocr = n.ocr || '';
      state.armed = null;

      F.body.value = n.body || '';
      F.notebook.value = n.notebook || '';

    function edPhotoData() {
      if (ed.photo !== undefined) return ed.photo;

    function renderEdPhoto() {

    function readEditor() {

    function saveEditor() {
      const v = readEditor();
      const b = ed.base;
      const changed = ed.photo !== undefined || ['title', 'body', 'notebook', 'source', 'capturedAt', 'ocr'].some((k) => (v[k] || '') !== (b[k] || ''))
        || v.labels.join(',') !== (b.labels || []).join(',');

        if (!v.title && !v.body && !v.hasPhoto) return;

      } else if (changed) {

    edForm.addEventListener('submit', () => { saveEditor(); });
    edForm.addEventListener('keydown', (e) => {

      // Keep checklists going: Enter on a "- [ ] item" line starts another one.
      if (e.key !== 'Enter' || e.shiftKey || e.ctrlKey || e.metaKey) return;
      const ta = e.target;
      const start = ta.value.lastIndexOf('\n', ta.selectionStart - 1) + 1;
      const line = ta.value.slice(start, ta.selectionStart);
      const m = line.match(/^(\s*)([-*] \[[ xX]\] |[-*] )(.*)$/);
      if (!m) return;
      e.preventDefault();
      if (!m[3].trim()) { ta.setRangeText('', start, ta.selectionStart, 'end'); return; }
      const next = '\n' + m[1] + m[2].replace(/\[[xX]\]/, '[ ]');
      ta.setRangeText(next, ta.selectionStart, ta.selectionEnd, 'end');

    $('#photo-input').addEventListener('change', async (e) => {
      const file = e.target.files[0];

      try {
        ed.photo = await shrink(file);
        if (!F.capturedAt.value && file.lastModified && Date.now() - file.lastModified > 864e5) F.capturedAt.value = ymd(new Date(file.lastModified));
        if (F.source.value === state.captureSource && !ed.id) F.source.value = 'paper';
        renderEdPhoto();
      } catch (err) { fail(err); }
    });

    /** Shrink a photo to a JPEG data URL small enough for one Firestore document. */
    async function shrink(file) {
      const url = URL.createObjectURL(file);
      try {
        const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("That photo couldn't be read.")); i.src = url; });
        let max = 1800, q = 0.82, data = '';
        for (let i = 0; i < 10; i++) {
          const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
          const c = document.createElement('canvas');
          c.width = Math.round(img.naturalWidth * k);
          c.height = Math.round(img.naturalHeight * k);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          data = c.toDataURL('image/jpeg', q);
          if (data.length < 700000) return data;
          if (q > 0.6) q -= 0.08; else max = Math.round(max * 0.8);
        }
        return data;
      } finally { URL.revokeObjectURL(url); }
    }

    let tesseract;
    async function readText(data, onStatus) {
      if (!tesseract) {
        tesseract = new Promise((res, rej) => {
          const s = document.createElement('script');
          s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
          s.onload = () => res(window.Tesseract);
          s.onerror = () => { tesseract = null; rej(new Error("Couldn't load the text reader. Check the connection.")); };
          document.head.append(s);
        });
      }
      const T = await tesseract;
      onStatus('Starting…');
      const worker = await T.createWorker('eng', 1, {
        logger: (m) => { if (m.status === 'recognizing text') onStatus(`Reading… ${Math.round(m.progress * 100)}%`); },
      });
      try { return (await worker.recognize(data)).data.text.replace(/\n{3,}/g, '\n\n').trim(); } finally { await worker.terminate(); }
    }

    // ---- Move / label / source dialog ---------------------------------------------------------------

    let moveTarget = null;
    function openMove(ids, mode = 'notebook') {

        input.setAttribute('list', 'nb-list');

      } else if (mode === 'label') {

        $('#move-hint').textContent = 'Labels work like #tags, without having to write them into the note.';

    $('#move-form').addEventListener('submit', () => {

    // ---- Import --------------------------------------------------------------------------------------

    let impTab = 'paste';
    let impFiles = [];
    function openImport(tab = 'paste') {

    function setImpTab(tab) {
      impTab = tab;

      for (const p of document.querySelectorAll('[data-pane]')) p.hidden = p.dataset.pane !== tab;
      $('#imp-common').hidden = tab === 'how';

    function splitPaste(text, mode) {
      const t = text.replace(/\r\n?/g, '\n').trim();
      if (!t) return [];
      const parts = mode === 'blank' ? t.split(/\n\s*\n/) : mode === 'rule' ? t.split(/\n\s*(?:-{3,}|\*{3,}|_{3,})\s*\n/) : mode === 'line' ? t.split('\n') : [t];
      return parts.map((p) => p.trim()).filter(Boolean).map((body) => ({ body }));
    }
    const strip = (html) => (new DOMParser().parseFromString(html, 'text/html').body?.innerText || '').replace(/\n{3,}/g, '\n\n').trim();
    const usecIso = (u) => (u ? new Date(Number(u) / 1000).toISOString() : '');

    async function parseFiles(files) {
      const out = [];
      for (const f of files) {
        const text = await f.text();
        const base = f.name.replace(/\.[^.]+$/, '');
        const written = f.lastModified ? ymd(new Date(f.lastModified)) : '';
        if (/\.json$/i.test(f.name)) {
          let j;
          try { j = JSON.parse(text); } catch { continue; }
          if (j && Array.isArray(j.notes)) { // a Commonplace backup
            for (const n of j.notes) out.push({ ...n, restore: true });
          } else if (j && ('textContent' in j || 'listContent' in j || 'title' in j) && !j.isTrashed) { // Google Keep (Takeout)
            const list = (j.listContent || []).map((x) => `- [${x.isChecked ? 'x' : ' '}] ${x.text}`).join('\n');
            out.push({
              title: j.title || '',
              body: [j.textContent || '', list].filter(Boolean).join('\n\n'),
              labels: (j.labels || []).map((l) => l.name),
              source: 'keep',
              pinned: !!j.isPinned,
              archived: !!j.isArchived,
              createdAt: usecIso(j.createdTimestampUsec) || undefined,
              updatedAt: usecIso(j.userEditedTimestampUsec) || undefined,
              capturedAt: j.createdTimestampUsec ? ymd(new Date(Number(j.createdTimestampUsec) / 1000)) : '',
            });
          }
        } else if (/\.html?$/i.test(f.name)) {
          // Keep's Takeout also writes an .html for every note; skip those if the .json is in the same batch.
          if (files.some((g) => g.name === base + '.json')) continue;
          out.push({ title: base, body: strip(text), capturedAt: written });
        } else {
          out.push({ title: base, body: text.replace(/\r\n?/g, '\n').trim(), capturedAt: written });
        }
      }
      return out;
    }

    function impPreview() {
      const p = $('#imp-preview');

      } else p.textContent = '';

    }
    // Built on first use, after sign-in: the signed-out page stays a plain sign-in screen.
    const IMPORT_HTML = `
    <form id="imp-form" method="dialog" autocomplete="off">

        <div data-pane="paste" class="photo">

        </div>
        <div data-pane="files" class="photo" hidden>
          <p class="help" style="margin:0">Text, Markdown and HTML files become one note each, titled by file name. Google Keep notes from
            <a href="https://takeout.google.com/" target="_blank" rel="noopener">Google Takeout</a> (the <code>.json</code> files in the Keep folder) keep their
            titles, checklists, labels, dates, pins and archive state. A Commonplace export restores as-is. Notes already here are skipped.</p>
          <input type="file" id="imp-files" multiple accept=".txt,.md,.markdown,.json,.html,.htm,.csv,text/*,application/json">
        </div>
        <div data-pane="how" class="help" hidden>
          <h3>From your phone (Android)</h3>
          <p>Open this page in Chrome, then menu ⋮ → <b>Add to Home screen</b> / <b>Install app</b>. After that, Commonplace shows up in the

          <p>In a Gemini reply, tap <b>Share</b> (or copy) and pick Commonplace. On the web, copy the reply and paste it into the box at the top.
            Notes are marked as from Gemini automatically when the shared text has a Gemini link.</p>

          <p>Share a Doc to Commonplace to save its link, or download it as <b>.txt</b> (File → Download → Plain text) and add it in the Files tab

          <h3>From paper notebooks</h3>
          <p>Tap <b>+</b>, then <b>Add photo</b> and photograph the page. <b>Read text from photo</b> pulls out the words so the page is searchable
            (works best on printing; check it on handwriting). Set <b>Date written</b> to when you wrote it.</p>
          <h3>Search tips</h3>
          <ul>
            <li><code>dentist</code> words anywhere · <code>"exact phrase"</code> · <code>-word</code> leaves out</li>
            <li><code>#recipe</code> tag · <code>in:work</code> notebook · <code>from:gemini</code> source</li>
            <li><code>is:pinned</code> <code>is:todo</code> <code>is:photo</code> <code>is:inbox</code> <code>is:archived</code></li>
            <li><code>after:2026-01-01</code> <code>before:2026-06-30</code></li>
          </ul>
        </div>
        <div class="fields" id="imp-common">
          <label>Came from <select id="imp-source"></select></label>
          <label>Notebook <input id="imp-nb" list="nb-list" placeholder="Inbox (unfiled)"></label>
        </div>
        <p class="hint" id="imp-preview" style="margin:0"></p>
      </div>
      <div class="dlg-foot">
        <span class="spacer"></span>
        <button type="button" data-act="imp-cancel">Close</button>

    function wireImport() {
      if ($('#imp-form')) return;
      $('#import').innerHTML = IMPORT_HTML;
    $('#imp-text').addEventListener('input', impPreview);
    $('#imp-split').addEventListener('change', impPreview);
    $('#imp-files').addEventListener('change', async (e) => {
      impFiles = await parseFiles([...e.target.files]).catch((err) => { fail(err); return []; });
      if (impFiles.length && impFiles.every((n) => n.source === 'keep')) $('#imp-source').value = 'keep';
      impPreview();
    });

    $('#imp-form').addEventListener('submit', (e) => {
      if (impTab === 'how') return;
      const raw = impTab === 'paste' ? splitPaste($('#imp-text').value, $('#imp-split').value) : impFiles;
      const source = $('#imp-source').value;
      const notebook = $('#imp-nb').value.trim();
      const seen = new Set([...state.notes.values()].filter((n) => !n.trashed).map((n) => norm(n.title) + '\u0000' + norm(n.body).trim()));
      const items = [];
      let skipped = 0;
      const t = nowIso();
      for (const r of raw) {
        const key = norm(r.title) + '\u0000' + norm(r.body).trim();
        if (seen.has(key) || (!r.title && !r.body)) { skipped++; continue; }
        seen.add(key);
        const { id, restore, owner, ...rest } = r;
        const patch = restore
          ? { ...blankNote(), ...rest, hasPhoto: false }
          : { ...blankNote(), ...Object.fromEntries(Object.entries(rest).filter(([, v]) => v !== undefined)), source, notebook };
        if (!restore) { patch.createdAt = r.createdAt || t; patch.updatedAt = r.updatedAt || patch.createdAt; }
        items.push({ id: newId(), patch });
      }
      writeNotes(items);
      state.error = '';
      $('#imp-text').value = '';
      $('#imp-files').value = '';
      impFiles = [];
      if (items.length) {
        state.q = ''; $('#q').value = '';
        state.notebook = notebook || null; state.source = null; state.tag = null;
        state.box = notebook ? 'all' : 'inbox';
      }
      toast(`Imported ${items.length} note${items.length === 1 ? '' : 's'}${skipped ? `, skipped ${skipped} already here or empty` : ''}.`);
      render();
    });
    }

    function toast(msg) {
      const el = document.createElement('div');
      el.className = 'toast';
      el.textContent = msg;
      $('#toasts').append(el);
      setTimeout(() => el.remove(), 5000);
    }

    // ---- Export --------------------------------------------------------------------------------------

    function download(name, text, type) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([text], { type }));
      a.download = name;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }
    const live = () => [...state.notes.values()].filter((n) => !n.trashed).sort((a, b) => (when(b) || '').localeCompare(when(a) || ''));
    function exportJson() {
      const notes = live().map(({ owner, ...n }) => n);
      download(`commonplace-${ymd(new Date())}.json`, JSON.stringify({ app: 'commonplace', exported: nowIso(), notes }, null, 2), 'application/json');
    }
    function exportMd() {
      const groups = new Map();
      for (const n of live()) {
        const k = n.notebook || 'Inbox';
        if (!groups.has(k)) groups.set(k, []);
        groups.get(k).push(n);
      }
      let md = `# Commonplace export, ${ymd(new Date())}\n`;
      for (const [nb, list] of [...groups.entries()].sort((a, b) => a[0].localeCompare(b[0]))) {
        md += `\n# ${nb}\n`;
        for (const n of list) {
          const title = n.title || (n.body || '').split('\n')[0].slice(0, 60) || 'Untitled';
          const meta = [srcOf(n).label, when(n).slice(0, 10), tagsOf(n).map((t) => '#' + t).join(' ')].filter(Boolean).join(' · ');
          md += `\n## ${title}\n_${meta}_\n\n${n.body || ''}\n${n.ocr ? `\n> Text in photo:\n> ${n.ocr.replace(/\n/g, '\n> ')}\n` : ''}`;
        }
      }
      download(`commonplace-${ymd(new Date())}.md`, md, 'text/markdown');
    }

    // ---- Events --------------------------------------------------------------------------------------

    const noteOf = (el) => state.notes.get(el.closest('[data-id]')?.dataset.id);
    const setFacet = (k, v) => {
      state[k] = state[k] === v ? null : v;
      state.navOpen = false;
      state.selected.clear();
      window.scrollTo({ top: 0 });
      render();
    };

    document.addEventListener('click', async (ev) => {
      if (ev.target.closest('a')) return;
      const t = ev.target.closest('[data-act]');
      if (!t) return;
      const act = t.dataset.act;
      if (t.tagName === 'SELECT') return;
      if (!['trash', 'purge', 'empty-trash', 'bulk-purge', 'ed-delete'].includes(act)) state.armed = null;

      if (act === 'signin') {
        signInWithPopup(auth, new GoogleAuthProvider()).catch((e) => { if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') fail(e); });
        return;
      }
      if (act === 'signout') { $('#account').close(); return void signOut(auth); }
      if (act === 'account') {
        const u = state.user;
        $('#acct-body').innerHTML = `<p class="dlg-title">${esc(u.displayName || 'Signed in')}</p><p class="muted" style="margin:0">${esc(u.email)}</p>
          <p class="hint" style="margin:0">${state.notes.size} notes. Only this account can see them. Sign in with it on any device to get them there.</p>`;
        return void $('#account').showModal();
      }
      if (act === 'menu') { state.navOpen = !state.navOpen; return renderSide(); }
      if (act === 'dismiss') { state.error = ''; return render(); }
      if (act === 'box') {
        state.box = t.dataset.box; state.notebook = state.source = state.tag = null; state.navOpen = false; state.selected.clear();
        state.q = ''; $('#q').value = '';
        saveView(); window.scrollTo({ top: 0 }); return render();
      }
      if (act === 'nb') return setFacet('notebook', t.dataset.nb);
      if (act === 'src') return setFacet('source', t.dataset.src);
      if (act === 'tag') { ev.stopPropagation(); return setFacet('tag', t.dataset.tag); }
      if (act === 'more-tags') { state.showAllTags = !state.showAllTags; return renderSide(); }
      if (act === 'clear') { state[{ nb: 'notebook', src: 'source', tag: 'tag' }[t.dataset.k]] = null; return render(); }
      if (act === 'select') { state.selecting = !state.selecting; state.selected.clear(); return render(); }
      if (act === 'select-all') { visible().list.forEach((n) => state.selected.add(n.id)); return render(); }
      if (act === 'import') { state.navOpen = false; renderSide(); return openImport(); }
      if (act === 'export-json') return exportJson();
      if (act === 'export-md') return exportMd();
      if (act === 'new') {
        const text = $('#cap-text').value;
        $('#cap-text').value = '';
        autoGrow();
        return openEditor(blankNote({ body: text, notebook: $('#cap-nb').value.trim() || state.notebook || '', source: $('#cap-source').value }), true);
      }
      if (act === 'empty-trash') {
        if (state.armed !== 'empty-trash') { state.armed = 'empty-trash'; return render(); }
        state.armed = null;
        destroy([...state.notes.values()].filter((n) => n.trashed).map((n) => n.id));
        return render();
      }

      // Bulk actions
      const sel = [...state.selected];
      const done = () => { state.selected.clear(); state.selecting = false; render(); };
      if (act === 'bulk-file') return openMove(sel, 'notebook');
      if (act === 'bulk-label') return openMove(sel, 'label');
      if (act === 'bulk-source') return openMove(sel, 'source');
      if (act === 'bulk-pin') { patchNotes(sel, { pinned: true }); return done(); }
      if (act === 'bulk-archive') { patchNotes(sel, { archived: true, pinned: false }); return done(); }
      if (act === 'bulk-trash') { patchNotes(sel, { trashed: true, pinned: false }); toast(`Moved ${sel.length} to Trash.`); return done(); }
      if (act === 'bulk-restore') { patchNotes(sel, { trashed: false }); return done(); }
      if (act === 'bulk-purge') {
        if (state.armed !== 'bulk') { state.armed = 'bulk'; return render(); }
        state.armed = null; destroy(sel); return done();
      }

      // Editor
      if (act === 'ed-cancel') return $('#editor').close();
      if (act === 'ed-photo-add') return $('#photo-input').click();
      if (act === 'ed-photo-remove') { ed.photo = null; ed.ocr = ''; return renderEdPhoto(); }
      if (act === 'ed-ocr') {
        const data = edPhotoData();
        if (!data) return;
        const ocrEl = $('#ed-ocr');
        if (ocrEl) ed.ocr = ocrEl.value;
        ed.ocrBusy = 'Loading reader…';
        renderEdPhoto();
        try {
          const text = await readText(data, (s) => { ed.ocrBusy = s; const b = document.querySelector('[data-act=ed-ocr]'); if (b) b.textContent = s; });
          ed.ocr = [ed.ocr.trim(), text].filter(Boolean).join('\n\n');
          if (!text) toast("Couldn't find any words in that photo.");
        } catch (err) { fail(err); }
        ed.ocrBusy = false;
        return renderEdPhoto();
      }
      if (act === 'ed-delete') {
        if (state.armed !== 'ed') { state.armed = 'ed'; t.className = 'armed'; t.textContent = 'Move to Trash?'; return; }
        state.armed = null;
        patchNotes([ed.id], { trashed: true, pinned: false });
        ed.id = null; ed.base = blankNote(); // nothing left for close to save
        $('#editor').close();
        return;
      }
      if (act === 'move-cancel') { moveTarget = null; return $('#move').close(); }
      if (act === 'imp-cancel') return $('#import').close();
      if (act === 'imp-tab') return setImpTab(t.dataset.tab);

      // A single note
      const n = noteOf(t);
      if (!n) return;
      if (act === 'check') {
        ev.stopPropagation();
        const lines = String(n.body).split('\n');
        const i = Number(t.dataset.line);
        lines[i] = lines[i].replace(/\[( |x|X)\]/, (m, c) => (c === ' ' ? '[x]' : '[ ]'));
        return patchNotes([n.id], { body: lines.join('\n') });
      }
      if (act === 'open') {
        if (state.selecting) { state.selected.has(n.id) ? state.selected.delete(n.id) : state.selected.add(n.id); return render(); }
        if (window.getSelection()?.toString()) return;
        return openEditor(n);
      }
      if (act === 'pin') { patchNotes([n.id], { pinned: !n.pinned }); return; }
      if (act === 'file') return openMove([n.id], 'notebook');
      if (act === 'archive') { patchNotes([n.id], { archived: !n.archived, pinned: false }); if (!n.archived) toast('Archived. Find it under Archive or by searching.'); return; }
      if (act === 'trash') { patchNotes([n.id], { trashed: true, pinned: false }); toast('Moved to Trash.'); return; }
      if (act === 'restore') { patchNotes([n.id], { trashed: false }); return; }
      if (act === 'purge') {
        if (state.armed !== n.id) { state.armed = n.id; return render(); }
        state.armed = null; destroy([n.id]); return;
      }
    });

    document.addEventListener('change', (ev) => {
      if (ev.target.dataset?.act === 'sort') { state.sort = ev.target.value; saveView(); render(); }
    });
    document.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter' && ev.target.matches?.('article.note')) { ev.preventDefault(); ev.target.click(); }
      if (document.querySelector('dialog[open]') || ev.target.closest?.('input, textarea, select')) return;
      if (ev.key === '/' || (ev.key === 'k' && (ev.ctrlKey || ev.metaKey))) { ev.preventDefault(); $('#q').focus(); $('#q').select(); }
      else if (ev.key === 'n' && !ev.ctrlKey && !ev.metaKey && state.user) { ev.preventDefault(); $('#cap-text').focus(); }
    });

    let qTimer;
    $('#q').addEventListener('input', (e) => {
      clearTimeout(qTimer);
      qTimer = setTimeout(() => { state.q = e.target.value; state.selected.clear(); renderList(); }, 120);
    });
    $('#q').addEventListener('keydown', (e) => { if (e.key === 'Escape') { e.target.value = ''; state.q = ''; renderList(); e.target.blur(); } });

    // Quick capture
    const capText = $('#cap-text');
    const autoGrow = () => { capText.style.height = 'auto'; capText.style.height = Math.min(capText.scrollHeight + 2, 320) + 'px'; };
    capText.addEventListener('input', autoGrow);
    capText.addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); $('#capture').requestSubmit(); } });
    $('#cap-source').addEventListener('change', (e) => { state.captureSource = e.target.value; saveView(); });
    $('#cap-nb').addEventListener('focus', (e) => { if (!e.target.value && state.notebook) e.target.value = state.notebook; });
    $('#capture').addEventListener('submit', (e) => {
      e.preventDefault();
      const body = capText.value.replace(/\s+$/, '');
      if (!body.trim()) return capText.focus();
      const notebook = $('#cap-nb').value.trim();
      writeNotes([{ id: newId(), patch: blankNote({ body, notebook, source: $('#cap-source').value }) }]);
      capText.value = '';
      autoGrow();
      toast(notebook ? `Saved to ${notebook}.` : 'Saved to Inbox.');
    });
    if (matchMedia('(pointer: coarse)').matches) $('#cap-hint').hidden = true;

    // ---- Shared from another app (Android share sheet → installed app) ------------------------------

    const params = new URLSearchParams(location.search);
    let share = null;
    if (params.has('text') || params.has('url') || params.has('title')) {
      share = { title: params.get('title') || '', text: params.get('text') || '', url: params.get('url') || '', source: params.get('source') || '' };
      history.replaceState(null, '', location.pathname);
    }
    function guessSource(s) {
      const all = `${s.text} ${s.url}`;
      if (/gemini\.google|g\.co\/gemini|bard\.google/i.test(all)) return 'gemini';
      if (/docs\.google|drive\.google/i.test(all)) return 'drive';
      if (/keep\.google/i.test(all)) return 'keep';
      if (s.url || /^https?:\/\/\S+$/.test(s.text.trim())) return 'web';
      return 'phone';
    }
    function takeShare() {
      if (!share || !state.user || !state.loaded) return;
      const s = share;
      share = null;
      let body = s.text.trim();
      if (s.url && !body.includes(s.url)) body = [body, s.url].filter(Boolean).join('\n');
      const title = s.title && !body.startsWith(s.title) ? s.title : '';
      openEditor(blankNote({ title, body, source: SRC[s.source] ? s.source : guessSource(s) }), true);
    }

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
    render();
  </script>
</body>
</html>
